<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Lore Tamayo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      color: #e2e8f0;
      background:
        radial-gradient(circle at 70% 20%, rgba(56,189,248,.18), transparent 28%),
        #020617;
    }
    main {
      width: min(92vw, 720px);
      padding: 48px;
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 28px;
      background: rgba(15,23,42,.72);
      backdrop-filter: blur(18px);
      text-align: center;
    }
    .code { color: #7dd3fc; font-size: 5rem; font-weight: 900; margin: 0; }
    h1 { margin: 12px 0; font-size: 2rem; }
    p { color: #94a3b8; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      border-radius: 12px;
      background: #38bdf8;
      color: #020617;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p>The page you requested does not exist or may have been moved.</p>
    <a href="/">Return to portfolio</a>
  </main>
</body>
</html>
